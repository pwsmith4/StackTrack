name: Deploy StackTrack admin to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main", "test"]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      # Pages has one site per repository. Build both branches into that one
      # artifact so main stays at / and test is always available at /testing/.
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: test
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json
      - name: Install production dependencies
        working-directory: production
        run: npm ci
      - name: Build production admin
        working-directory: production
        env:
          # The stable site uses the frozen main API. The explicit fallback
          # keeps the pilot working until the optional repository variable is
          # added without putting any credential in source control.
          VITE_API_URL: ${{ vars.STACKTRACK_MAIN_API_URL || 'https://stacktrack-api-main.livelyrock-97a45fca.westus3.azurecontainerapps.io' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run check --workspace @stacktrack/admin
          npm run build:admin
      - name: Install preview dependencies
        working-directory: preview
        run: npm ci
      - name: Build testing admin
        working-directory: preview
        env:
          VITE_API_URL: ${{ vars.STACKTRACK_TEST_API_URL || vars.STACKTRACK_API_URL || 'https://stacktrack-api-test.livelyrock-97a45fca.westus3.azurecontainerapps.io' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/testing/
        run: |
          npm run check --workspace @stacktrack/admin
          npm run build:admin
      - name: Combine production and preview sites
        run: |
          mkdir -p site/testing
          cp -R production/apps/admin/dist/. site/
          cp -R preview/apps/admin/dist/. site/testing/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
