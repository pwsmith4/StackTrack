name: Build and deploy StackTrack API

on:
  workflow_dispatch:
  push:
    branches: ["main", "test"]
    paths:
      - "apps/api/**"
      - "packages/domain/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-image.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stacktrack-api
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy ${{ github.ref_name }} API to Azure
    needs: build-and-publish
    runs-on: ubuntu-latest
    # "test" and "production" are GitHub Environments. Their values are
    # intentionally separate, so a test push cannot update production.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify Azure deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub environment variable::Add ${name} to the '${{ github.ref_name == 'main' && 'production' || 'test' }}' GitHub Environment before deploying."
              exit 1
            fi
          done
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      - name: Sign in to Azure with GitHub OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create a revision from the branch image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/stacktrack-api:${{ github.ref_name }}"
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --output none
      - name: Verify the deployed API health
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://${FQDN}/health"; then
              exit 0
            fi
            echo "Waiting for the new revision to become healthy (${attempt}/30)…"
            sleep 10
          done
          echo "The Container App revision did not become healthy in five minutes." >&2
          exit 1
