services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stacktrack
      POSTGRES_USER: stacktrack
      POSTGRES_PASSWORD: stacktrack
    ports:
      - "5432:5432"
    volumes:
      - stacktrack-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacktrack -d stacktrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stacktrack-postgres:

